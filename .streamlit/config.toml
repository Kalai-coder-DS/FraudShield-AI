# Must match the colours in src/fraudshield/ui/theme.py (checked by tests/test_ui.py)
[theme]
base = "dark"
primaryColor = "#E63946"            # alert red accent
backgroundColor = "#140D0E"         # red-tinted charcoal background
secondaryBackgroundColor = "#1E1315" # sidebar and input backgrounds
textColor = "#F5EDEE"               # soft white
font = "sans serif"

[server]
maxUploadSize = 200   # MB; uploads above this are rejected by Streamlit

[browser]
gatherUsageStats = false
