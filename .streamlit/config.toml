# Must match the colours in src/fraudshield/ui/theme.py (checked by tests/test_ui.py)
[theme]
base = "dark"
primaryColor = "#0D9488"            # teal brand accent
backgroundColor = "#111318"         # neutral graphite background
secondaryBackgroundColor = "#171A21" # sidebar and input backgrounds
textColor = "#E8EAED"               # soft white
font = "sans serif"

[server]
maxUploadSize = 200   # MB; uploads above this are rejected by Streamlit

[browser]
gatherUsageStats = false
