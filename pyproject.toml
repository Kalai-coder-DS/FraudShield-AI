[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudshield"
version = "0.1.0"
description = "FraudShield AI - machine-learning fraud detection and risk intelligence platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
# Deprecation warnings raised from our own code fail the tests, so they are fixed early.
filterwarnings = [
    "error::DeprecationWarning:fraudshield.*",
    "error::FutureWarning:fraudshield.*",
]

[tool.coverage.run]
source = ["src/fraudshield"]
concurrency = ["thread"]  # Streamlit page tests run in a thread

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
